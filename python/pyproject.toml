[project]
name = "lid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GabrielmAlves", email = "gabrielmalves10@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
lid = "lid:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
